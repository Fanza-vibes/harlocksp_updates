# Il bot: ogni giro controlla le partite nuove, le curiosità, i comandi privati e il riepilogo
# delle 23, poi salva state.json sul branch bot-state (mai su main). Dettagli tecnici in CLAUDE.md.
name: Controllo partite

on:
  schedule:
    - cron: "*/5 * * * *" # minimo consentito da GitHub; può ritardare di qualche minuto
  workflow_dispatch: # avvio manuale da Actions (o da una sveglia esterna tramite l'API di GitHub)

# Un solo giro alla volta: evita invii doppi e conflitti su state.json
concurrency:
  group: check-matches
  cancel-in-progress: false

permissions:
  contents: write # serve per il commit di state.json sul branch bot-state

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Lo stato vive sul branch bot-state, separato dal codice di main
      - name: Leggi lo stato
        id: load
        run: scripts/state_branch.sh load

      - name: Controlla e invia
        # limite sul passo (non sul job): se scade, il salvataggio dello stato gira comunque
        timeout-minutes: 6
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.main

      # Salva il progresso anche se un invio è fallito, ma solo se lo stato era stato letto
      # correttamente: altrimenti si rischierebbe di salvare uno stato vecchio.
      - name: Salva lo stato
        if: always() && steps.load.outcome == 'success'
        run: scripts/state_branch.sh save
