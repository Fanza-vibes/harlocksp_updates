# Il bot: ogni giro controlla le partite nuove, le curiosità, i comandi privati e il riepilogo
# delle 23, poi salva state.json nel repository. Dettagli tecnici in CLAUDE.md.
name: Controllo partite

on:
  schedule:
    - cron: "*/5 * * * *" # minimo consentito da GitHub; può ritardare di qualche minuto
  workflow_dispatch: # avvio manuale da Actions (o da una sveglia esterna tramite l'API di GitHub)

# Un solo giro alla volta: evita invii doppi e conflitti su state.json
concurrency:
  group: check-matches
  cancel-in-progress: false

permissions:
  contents: write # serve per il commit di state.json

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Controlla e invia
        # limite sul passo (non sul job): se scade, il salvataggio di state.json gira comunque
        timeout-minutes: 6
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.main

      # Anche se un invio fallisce, salva il progresso fatto fin lì
      - name: Salva state.json se cambiato
        if: always()
        # commit solo se il file è cambiato; [skip ci] evita di avviare i test per questo commit.
        # pull --rebase gestisce il caso raro in cui main sia cambiato durante il giro.
        run: |
          if git diff --quiet -- state.json; then
            echo "state.json invariato"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "Aggiorna state.json [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --quiet && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
